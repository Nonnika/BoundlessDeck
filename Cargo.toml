[package]
name = "boundlessdeck"
version = "0.1.0"
edition = "2024"

# For `cargo bundle` (cargo-bundle): the .app's icon.
[package.metadata.bundle]
name = "BoundlessDeck"
identifier = "com.boundlessdeck.app"
icon = ["resources/icon.icns"]
[package.metadata.bundle.osx]
minimum_system_version = "13.0"

[dependencies]
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
anyhow = "1"
rand = "0.8"
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
pulldown-cmark = { version = "0.12", default-features = false }
alacritty_terminal = "0.25"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
smol = "2"
unicode-segmentation = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.37"
tempfile = "3"
wry = { version = "0.57", default-features = false, features = ["os-webview"] }


[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3.2", features = ["NSData", "NSDictionary", "NSError", "NSGeometry", "NSThread", "NSString", "NSArray", "NSValue", "NSKeyValueCoding"] }
objc2-app-kit = { version = "0.3.2", features = ["objc2-core-image", "NSApplication", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSEvent", "NSResponder", "NSWindow", "NSView", "NSGraphics", "NSAccessibility", "NSWorkspace", "block2"] }
objc2-core-image = { version = "0.3.2", features = ["CIFilter"] }
raw-window-handle = "0.6"
objc2-web-kit = { version = "0.3.2", features = ["WKWebView", "WKSnapshotConfiguration", "block2", "objc2-app-kit"] }
