<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- BoundlessDeck app icon: a robot peeking out of a deck of blocks, with an orbit and a spark.
       Render: rsvg-convert -w 1024 -h 1024 resources/icon.svg -o resources/icon.png -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F2F4FA"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="10" result="b"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.28"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="halo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D9E2FC"/>
      <stop offset="0.75" stop-color="#EEF2FE"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="haloIn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3F6CF2"/>
      <stop offset="1" stop-color="#4C7BF7"/>
    </linearGradient>
    <linearGradient id="orbit" gradientUnits="userSpaceOnUse" x1="-350" y1="0" x2="350" y2="0">
      <stop offset="0" stop-color="#6E8DF6" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#6E8DF6" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#7B97F6" stop-opacity="0.9"/>
    </linearGradient>
    <clipPath id="front"><rect x="-400" y="0" width="800" height="200"/></clipPath>
    <clipPath id="body"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>

  <g clip-path="url(#body)">
    <g transform="translate(0 22)">
      <!-- orbit, back half -->
      <g transform="translate(514 500) rotate(-17)">
        <ellipse rx="350" ry="98" fill="none" stroke="url(#orbit)" stroke-width="11"/>
      </g>

      <!-- robot -->
      <circle cx="512" cy="368" r="126" fill="url(#halo)"/>
      <circle cx="512" cy="372" r="106" fill="url(#haloIn)"/>
      <rect x="434" y="334" width="156" height="94" rx="47" fill="#202129"/>
      <rect x="477" y="362" width="20" height="40" rx="10" fill="#FFFFFF"/>
      <rect x="527" y="362" width="20" height="40" rx="10" fill="#FFFFFF"/>

      <!-- the deck: three layers of blocks -->
      <path d="M272 620 L512 530 L752 620 L512 710 Z" fill="#D3DDFC"/>
      <path d="M272 550 L512 460 L752 550 L512 640 Z" fill="#A7BBF9"/>
      <path d="M272 480 L410 428 L512 466 L614 428 L752 480 L512 570 Z" fill="url(#top)" stroke="url(#top)" stroke-width="6" stroke-linejoin="round"/>

      <!-- orbit, front half -->
      <g transform="translate(514 500) rotate(-17)" clip-path="url(#front)">
        <ellipse rx="350" ry="98" fill="none" stroke="url(#orbit)" stroke-width="11"/>
      </g>

      <!-- spark -->
      <path transform="translate(690 270)" d="M0 -40 Q5 -5 40 0 Q5 5 0 40 Q-5 5 -40 0 Q-5 -5 0 -40 Z" fill="#3F6EF0"/>
    </g>
  </g>
</svg>
